
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101317">
  <title>Los Santos | Cheat Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="brand">
      <span class="logo">LS</span>
      <div>
        <h1>LOS SANTOS</h1>
        <p>CHEAT COMPANION</p>
      </div>
    </div>
    <span class="platform">PC VERSION</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">GRAND THEFT AUTO V</p>
      <h2>Find your cheat.</h2>
      <p>Every code. One tap away.</p>

      <input
        type="search"
        id="search"
        placeholder="Search cheats or codes..."
        autocomplete="off"
      >
    </section>

    <nav id="filters" class="filters"></nav>

    <section class="results">
      <div class="results-heading">
        <h3>CHEAT CODES</h3>
        <span id="count"></span>
      </div>

      <div id="cheat-list"></div>
    </section>

    <footer>
      <p>LOS SANTOS CHEAT COMPANION</p>
      <p>Unofficial GTA V reference tool</p>
    </footer>
  </main>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
